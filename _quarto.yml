project:
  type: website
  render:
    - "*.ipynb"

format:
  html:
    toc: true
    css: styles.css
    code-block-bg: true
    code-overflow: wrap
    code-line-numbers: true
    monofont: D2Coding
    language:
      crossref-tbl-title: "표"

bibliography: references.bib
reference-location: margin

website:
  title: "GitLab Book"
  sidebar:
    style: "docked"
    search: true
    contents:
      - "index.ipynb"
      - section: "CI/CD"
        contents:
        - "cicd/runner.ipynb"
        - "cicd/gitlab-ci.yaml.ipynb"
        - "cicd/pipeline.ipynb"
        - "cicd/job.ipynb"
